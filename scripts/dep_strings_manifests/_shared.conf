# =============================================
#   共享依赖字符串混淆配置
#
#   多个项目共用的 plugin 配置写在这里
#   各项目的 <project>.conf 可覆盖此处设定
#   设为 disabled 可显式禁用某个 plugin
#
#   格式: plugin_name: lang1,lang2,...
#   可选语言: dart, swift, objc (逗号分隔)
#   特殊值:   disabled
# =============================================

