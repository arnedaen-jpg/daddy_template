# =============================================
#   Dart 专用字符串跳过规则
#   （会与 common.conf 合并使用）
#
#   注意: Dart 混淆使用 dart_obfuscator（AST 分析），
#   已内置 const 上下文、import URI、switch case 等跳过逻辑。
#   此文件仅作为额外补充，主要用于跳过「AST 识别不到的」模式。
#   dart_obfuscator 自身的跳过规则见:
#     scripts/dart_obfuscator/lib/visitors/string_obfuscator.dart
# =============================================

# --- package URI ---
/^package:/

# --- 日期格式 ---
/^[yYMdDhHmsSaEZ\s\-:\/.,]+$/

# --- 纯大写常量（DEBUG, INFO 等）---
/^[A-Z][A-Z0-9_]{1,10}$/
