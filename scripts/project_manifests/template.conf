# =============================================
#   项目 Framework 混淆清单
#   
#   格式: type:name:version:level
#   
#   type:    remote (pub.dev 依赖) | local (plugins/ 本地依赖)
#   name:    依赖包名（重命名前的原始名）
#   version: 依赖版本（remote 必填，local 留空）
#   level:   混淆层次
#            L0       = 仅注入唯一类（不修改原码，最安全）
#            L1       = L0 + 内部符号重命名
#            L2       = L1 + 方法顺序打乱
#            L3       = L2 + 死分支注入
#            disabled = 跳过此依赖
#
#   建议：
#   - 新增依赖先设 L0，测试通过后逐步提升
#   - 不确定的依赖设 disabled
#   - 有独立 profile 文件的依赖才建议设 L1+
# =============================================

# === 远程依赖 (pub.dev) ===
# 这些依赖如果多个项目使用同版本，可以共用 profile
# remote:connectivity_plus:6.1.3:L0
# remote:device_info_plus:11.2.0:L0
# remote:shared_preferences:2.2.3:L0
# remote:url_launcher:6.1.10:L0
# remote:permission_handler:10.2.0:L0
# remote:fluttertoast:8.2.12:L0
# remote:image_picker:1.0.4:L0

# === 本地依赖 (plugins/) ===
# 这些是项目 fork 的插件，每个项目可能不同
# local:video_player::L0
# local:flick_video_player::L0
# local:flutter_inappwebview::disabled
# local:image_compression_flutter::L0
# local:flutter_html::disabled
