# =============================================
#   dq 项目（斗球/直播，源工程示例: xty）Framework 混淆清单
#   Pod 名与版本须与「壳工程」ios/Podfile.lock 一致（fvm flutter pub get + ios/pod install 后对照）
#   本清单依据 /Users/t-yh/dqiu/ios/Podfile.lock（真实 B 面）整理
#   亦可用: ./scripts/obfuscate_frameworks.sh list -p dq 查看 B 面 pub 插件
# =============================================
# 格式: type:name:version:level
# 重要: 不要写行尾注释（解析器按 ':' 切分，行尾注释会污染 level 字段）。注释一律整行。
#
# 等级策略（与 oio 对齐，能 L3 就 L3）：
#   - 有匹配 profile 且 profile 支持 L3 → L3
#   - profile 仅到 L2（数据库/播放器等保守项）→ L2
#   - 播放器本地 fork fijkplayer → L1（与 oio 一致，配合 channel restore/verify 保运行时）
#   - 无匹配主版本 profile 的插件 → L0（仅注入唯一类 + 重命名，避免误走通用 L2/L3 变换）
#   - 二进制/第三方闭源 Pod → disabled
# 注: profile 实际按 plugins/ 内插件 pubspec 的真实主版本匹配；version 字段此处仅作记录。

