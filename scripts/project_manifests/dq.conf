# === 播放器本地 fork（plugins/fijkplayer，IJK） ===
# fijkplayer 走正常 plugins/ 重命名链路；local/fijkplayer.sh profile（跳过两个核心播放器文件），
# 重命名后由 obfuscate_frameworks.sh 的 restore_fijkplayer_runtime_channels /
# verify_fijkplayer_runtime_channels_after_obfuscation 保留并校验运行时 channel
# befovy.com/fijk* 与 befovy.com/fijkplayer/*，避免 Dart/ObjC channel 不匹配导致播放器静默失效。
# 等级取 L3：bili / yms 均以同一 local/fijkplayer.sh + 同款 BIJKPlayer:disabled 跑 fijkplayer L3
# （比 oio 的 L1 更深，profile 在 L2/L3 跳过 FijkPlugin.m/FijkPlayer.m，仅变异
# FijkQueuingEventSink.m/FijkHostOption.m）。如需最大化播放器稳定性，可回退 L1（oio 做法）。
# BIJKPlayer 为其二进制依赖，禁止混淆。
local:fijkplayer::L3

