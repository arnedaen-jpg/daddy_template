# =============================================
#   dq 项目（斗球/直播）闭包重命名清单
#
#   这些包不能按单个叶子依赖直接改名，需要把父包/平台实现包一起本地化，
#   并重写 pubspec 与 package: imports。仅保留 dq 真实使用的包
#   （依据 project_manifests/dq.conf 与壳工程 ios/Podfile.lock）。
#
#   安全性：obfuscate_frameworks.sh 仅在「包被引用」且「plugins/<新名> 已生成」
#   时才记录并应用某条改名；不满足则自动跳过（降级为 no-op），不会误伤。
#
#   格式: phase:old_name:new_name
# =============================================

# --- 第一批：低风险闭包 ---
phase1:shared_preferences:orbit_layout
phase1:shared_preferences_foundation:velvet_anchor
phase1:audioplayers:invoice_frame
phase1:audioplayers_darwin:canvas_group
phase1:just_audio:parcel_matrix
phase1:audio_session:ticket_filter

# --- 第二批：A/B 共用但可控 ---
phase2:connectivity_plus:blanket_vector
phase2:device_info_plus:ladder_pixel
phase2:package_info_plus:numeric_shelf
