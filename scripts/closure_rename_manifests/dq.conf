# =============================================
#   dq 项目（斗球/直播）闭包重命名清单
#
#   这些包不能按单个叶子依赖直接改名，需要把父包/平台实现包一起本地化，
#   并重写 pubspec 与 package: imports。仅保留 dq 真实使用的包
#   （依据 project_manifests/dq.conf 与壳工程 ios/Podfile.lock）。
#
#   安全性：obfuscate_frameworks.sh 仅在「包被引用」且「plugins/<新名> 已生成」
#   时才记录并应用某条改名；不满足则自动跳过（降级为 no-op），不会误伤。
#
#   格式: phase:old_name:new_name
# =============================================

# --- 第一批：低风险闭包 ---
# 注: dq 使用 get_storage 持久化，未引入 shared_preferences，故不在此列闭包重命名。
phase1:audioplayers:invoice_frame
phase1:audioplayers_darwin:canvas_group
phase1:just_audio:parcel_matrix
phase1:audio_session:ticket_filter

# just_audio / audio_session 并非直接依赖，而是经
#   flutter_widget_from_html(pub) → fwfh_just_audio → just_audio → audio_session
# 传递引入。若不把父包 fwfh_just_audio 一起本地化并重写其对 just_audio 的引用，
# 上面两条 rename 生成的本地副本 parcel_matrix/ticket_filter 将无人引用（死代码），
# 而 pub 原名 just_audio/audio_session 仍被注册使用 → 混淆对这两个包失效。
# 把 fwfh_just_audio 列为 support：本地化 + dependency_override 指向本地副本 +
# 重写其 just_audio→parcel_matrix 引用，使整条链改用改名后的包。
# （flutter_widget_from_html 无需本地化：它按名依赖 fwfh_just_audio，会命中本地 override。）
support:fwfh_just_audio

# --- 第二批：A/B 共用但可控 ---
phase2:connectivity_plus:blanket_vector
phase2:device_info_plus:ladder_pixel
phase2:package_info_plus:numeric_shelf
