  assets:
    # === 次要模块 assets (自动添加) ===
    - assets/secondary/images/
    - assets/secondary/images/cfgimgs/
    - assets/secondary/images/match/
    - assets/secondary/images/mine/
    - assets/secondary/images/esport/
    - assets/secondary/images/player/
    - assets/secondary/svgs/
    - assets/secondary/svgs/anchor/
    - assets/secondary/json/
    - assets/secondary/gif/
    - assets/secondary/audio/
    - assets/secondary/other/

  # assets:
  #   - assets/images/
  #   - assets/icons/
